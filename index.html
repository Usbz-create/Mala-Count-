<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mala Counter</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="script.js?v=4" defer></script>
</head>
<body>
    <main>
        <h1>Mala Counter</h1>

        <button id="counter" class="counter" aria-label="Tap to count">0</button>
        <p class="hint">This session &middot; tap the circle to count</p>

        <div class="actions">
            <button id="save" class="primary">Save</button>
            <button id="reset" class="reset">Reset session</button>
        </div>
        <p id="status" class="status"></p>

        <section class="card">
            <div class="progress-head">
                <span>Progress</span>
                <span id="barText">0%</span>
            </div>
            <div class="bar"><div id="bar" class="bar-fill"></div></div>

            <dl class="stats">
                <div><dt>Total beads</dt><dd id="statTotal">0</dd></div>
                <div><dt>Malas done</dt><dd id="statDone">0</dd></div>
                <div><dt>Target</dt><dd id="statTarget">0</dd></div>
                <div><dt>Malas left</dt><dd id="statLeft">0</dd></div>
                <div><dt>Beads left</dt><dd id="statBeadsLeft">0</dd></div>
                <div><dt>Time left</dt><dd id="statTime">0</dd></div>
            </dl>
        </section>

        <div class="actions">
            <button id="setTotal" class="reset">Set total</button>
            <button id="setTarget" class="reset">Set target</button>
        </div>
        <p class="version">v4</p>
    </main>

    <div id="overlay" class="overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <p id="modalText"></p>
            <input id="modalInput" type="number" inputmode="numeric" min="0" step="1">
            <p id="modalError" class="error"></p>
            <div class="actions">
                <button id="modalCancel" class="reset">Cancel</button>
                <button id="modalOk" class="primary">OK</button>
            </div>
        </div>
    </div>
</body>
</html>
