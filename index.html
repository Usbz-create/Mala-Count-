<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mala Counter</title>
    <link rel="stylesheet" href="style.css?v=3">
    <script src="script.js?v=3" defer></script>
</head>
<body>
    <main>
        <h1>Mala Counter</h1>
        <button id="counter" class="counter" aria-label="Tap to count">0</button>
        <p class="hint">Tap the circle to count</p>
        <div class="actions">
            <button id="setcount" class="reset">Set count</button>
            <button id="reset" class="reset">Reset</button>
        </div>
        <p class="version">v3</p>
    </main>

    <div id="overlay" class="overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <p id="modalText"></p>
            <input id="modalInput" type="number" inputmode="numeric" min="0" step="1">
            <p id="modalError" class="error"></p>
            <div class="actions">
                <button id="modalCancel" class="reset">Cancel</button>
                <button id="modalOk" class="primary">OK</button>
            </div>
        </div>
    </div>
</body>
</html>
