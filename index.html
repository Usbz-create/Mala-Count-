<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mala Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Mala Counter</h1>
        <button id="counter" class="counter" aria-label="Tap to count">0</button>
        <p class="hint">Tap the circle to count</p>
        <div class="actions">
            <button id="setcount" class="reset">Set count</button>
            <button id="reset" class="reset">Reset</button>
        </div>
    </main>
</body>
</html>
